<!DOCTYPE html>
<html>
<head>
    <link rel = "script" href = "script.js">
    <link rel="stylesheet" href="pillpal style.css">
</head>
<body>
    <header>
        <h1>pillpal</h1>
        <button type = "button" class = "addButton" onclick = "">+</button>
    </header>
    <div class = "state1">
        <h1 class = "question">What is the medicine called?</h1>
        <input type = "text" id = "medicine" class = "add-medicine" placeholder = "zertec, tums, etc.">
    </div>
    <div class = "state2">
        <h1 class = "question">When do you have to take it?</h1>
        <input type = "text" id = "time" class = "add-time" placeholder = "5pm, 2 times a day, before meals, etc.">
    </div>
    <div class = "state3">
        <h1 class = "question">for how long do you have to take it?</h1>
        <input type = "text" id = "time" class = "add-time" placeholder = "feb. 1, forever, etc.">
    </div>
</body>
</html>
